services:
  postgres:
    image: postgres:16
    container_name: tsqr-identity-db
    environment:
      POSTGRES_DB: tsqr_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - tsqr_identity_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  tsqr_identity_data:
